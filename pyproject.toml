[project]
name = "postfader-fl-studio-mcp"
version = "0.11.0"
description = "Unofficial local MCP bridge for verified FL Studio mixer and plug-in control on macOS"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
keywords = ["fl-studio", "mcp", "model-context-protocol", "midi", "music-production"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "anyio>=4.5,<5",
    "mcp[cli]>=2.0.0,<3",
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
    "soundfile>=0.12,<1",
    "pyloudnorm>=0.1.1,<1",
    "python-rtmidi>=1.5,<2",
    "pydantic>=2.12,<3",
]

[project.scripts]
fl-studio-mcp = "fl_studio_mcp.mcp_server:main"
postfader-install-bridge = "fl_studio_mcp.bridge_install:main"
postfader-doctor = "fl_studio_mcp.diagnostics:main"
postfader-plugin-report = "fl_studio_mcp.plugin_report:main"

[project.optional-dependencies]
test = [
    "tomli>=2; python_version < '3.11'",
]
dev = [
    "fl-studio-api-stubs>=37,<38",
    "tomli>=2; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/synopsys0/postfader-fl-studio-mcp"
Repository = "https://github.com/synopsys0/postfader-fl-studio-mcp"
Issues = "https://github.com/synopsys0/postfader-fl-studio-mcp/issues"
Documentation = "https://github.com/synopsys0/postfader-fl-studio-mcp#readme"

[build-system]
# 77 is the first release to understand PEP 639 `license`/`license-files`.
# Building with anything older silently drops the license metadata.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fl_studio_mcp"]

# The bridge ships as package data, not as a module. It is written against FL
# Studio's embedded API and cannot be imported anywhere else, so it must stay
# unreachable by `import` while still being installed for
# postfader-install-bridge to deploy.
[tool.setuptools.package-data]
fl_studio_mcp = ["_bridge/device_UniversalBridge.py"]
