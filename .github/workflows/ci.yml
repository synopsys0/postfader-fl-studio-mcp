name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-compatibility:
    name: MCP SDK ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: minimum-2.0.0
            mcp-spec: mcp==2.0.0
          - label: newest-allowed
            mcp-spec: mcp>=2.0.0,<3
    env:
      FL_BRIDGE_ENABLE_MIDI: "0"
      FL_BRIDGE_ENABLE_WRITES: "0"
      FL_BRIDGE_SANDBOXED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the selected SDK boundary
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[test]" "${{ matrix.mcp-spec }}"
          python -m pip check
      - name: Exercise registration, schemas, resources, and fail-closed input
        run: |
          python -c "import importlib.metadata; print('resolved mcp:', importlib.metadata.version('mcp'))"
          python tests/test_sdk_compatibility.py
          python tests/test_readonly_mcp.py

  safe-tests:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.10", "3.14"]
    env:
      FL_BRIDGE_ENABLE_MIDI: "0"
      FL_BRIDGE_ENABLE_WRITES: "0"
      FL_BRIDGE_SANDBOXED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Check public tree
        run: python scripts/check_public_tree.py

      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[test]"

      # The suite is hermetic: a fake FL API, synthetic audio, no MIDI. Say so
      # explicitly rather than relying on the runner having no CoreMIDI, so a
      # future transport change cannot quietly start touching a real device.
      - name: Run hermetic safe suite
        run: python scripts/run_safe_tests.py

      - name: Parse and dry-run native PowerShell entry points
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          foreach ($path in @('scripts/install.ps1', 'scripts/launch_fl_studio.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          $userData = Join-Path $env:RUNNER_TEMP 'FL Studio User Data'
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1 `
            -DryRun -Python (Get-Command python).Source -UserDataDir $userData
          $fakeFl = Join-Path $env:RUNNER_TEMP 'FL Studio 2026\FakeFL64.exe'
          New-Item -ItemType Directory -Force (Split-Path $fakeFl) | Out-Null
          Set-Content -LiteralPath $fakeFl -Value 'dry run only'
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File scripts/launch_fl_studio.ps1 -DryRun -Executable $fakeFl

  package:
    name: Build and clean-install on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      FL_BRIDGE_ENABLE_MIDI: "0"
      FL_BRIDGE_ENABLE_WRITES: "0"
      FL_BRIDGE_SANDBOXED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify archive contents and metadata
        run: python scripts/verify_distribution.py

      - name: Install and verify wheel in a clean temporary environment
        run: python scripts/clean_wheel_smoke.py --dist-dir dist

      - name: Build the platform setup bundles
        run: python scripts/build_release_bundles.py --output-dir release-bundles

      - name: Smoke-test the extracted Windows bundle launcher
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Get-ChildItem 'release-bundles\*-Windows.zip' | Select-Object -First 1
          if (-not $archive) { throw 'Windows setup bundle was not built' }
          $target = Join-Path $env:RUNNER_TEMP 'postfader-windows-bundle'
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $target
          $launcher = Get-ChildItem $target -Recurse -Filter 'Install PostFader.cmd' |
            Select-Object -First 1
          if (-not $launcher) { throw 'Windows setup launcher was not found' }
          $env:POSTFADER_BUNDLE_DRY_RUN = '1'
          & cmd.exe /d /c ('"' + $launcher.FullName + '"')
          if ($LASTEXITCODE -ne 0) { throw 'Windows bundle launcher dry run failed' }

      - name: Smoke-test the extracted macOS bundle launcher
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find release-bundles -name '*-macOS.zip' -print -quit)"
          test -n "$archive"
          target="$RUNNER_TEMP/postfader-macos-bundle"
          ditto -x -k "$archive" "$target"
          launcher="$(find "$target" -name 'Install PostFader.command' -print -quit)"
          test -n "$launcher"
          POSTFADER_BUNDLE_DRY_RUN=1 "$launcher"

      - name: Upload Python distributions
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: python-distributions-${{ matrix.os }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  mcpb:
    name: Validate user-facing release bundles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Set up Node for the MCPB packager
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Validate and build Claude Desktop extension
        run: python scripts/build_mcpb.py --output-dir mcpb-dist
      - name: Build deterministic Windows and macOS setup bundles
        run: python scripts/build_release_bundles.py --output-dir release-bundles
      - name: Upload Claude Desktop extension
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: desktop-extension
          path: mcpb-dist/*.mcpb
          if-no-files-found: error
      - name: Upload platform setup bundles
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: platform-setup-bundles
          path: release-bundles/*.zip
          if-no-files-found: error
