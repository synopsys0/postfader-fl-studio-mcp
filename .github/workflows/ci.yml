name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static quality and hermetic coverage
    # The guided-setup safe tests intentionally support only qualified desktop
    # hosts. Run coverage on macOS so the complete allowlisted suite executes
    # without pretending Linux is a supported setup target.
    runs-on: macos-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      FL_BRIDGE_ENABLE_MIDI: "0"
      FL_BRIDGE_ENABLE_WRITES: "0"
      FL_BRIDGE_SANDBOXED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[dev]"
      - name: Run Ruff lint and import checks
        run: python -m ruff check fl_studio_mcp scripts
      - name: Run Pyright baseline
        run: >-
          python -m pyright --project pyrightconfig.json
          --pythonpath "${{ steps.setup-python.outputs.python-path }}"
      - name: Run hermetic safe suite with coverage
        run: python scripts/run_coverage.py --artifact-dir coverage-artifacts
      - name: Upload hermetic coverage report
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: hermetic-coverage
          path: coverage-artifacts/
          if-no-files-found: error

  sdk-compatibility:
    name: MCP SDK ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: minimum-2.0.0
            mcp-spec: mcp==2.0.0
          - label: newest-allowed
            mcp-spec: mcp>=2.0.0,<2.1
    env:
      FL_BRIDGE_ENABLE_MIDI: "0"
      FL_BRIDGE_ENABLE_WRITES: "0"
      FL_BRIDGE_SANDBOXED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the selected SDK boundary
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[test]" "${{ matrix.mcp-spec }}"
          python -m pip check
      - name: Exercise registration, schemas, resources, and fail-closed input
        run: |
          python -c "import importlib.metadata; print('resolved mcp:', importlib.metadata.version('mcp'))"
          python tests/test_sdk_compatibility.py
          python tests/test_readonly_mcp.py

  safe-tests:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.10", "3.14"]
    env:
      FL_BRIDGE_ENABLE_MIDI: "0"
      FL_BRIDGE_ENABLE_WRITES: "0"
      FL_BRIDGE_SANDBOXED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Check public tree
        run: python scripts/check_public_tree.py

      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[test]"

      # The suite is hermetic: a fake FL API, synthetic audio, no MIDI. Say so
      # explicitly rather than relying on the runner having no CoreMIDI, so a
      # future transport change cannot quietly start touching a real device.
      - name: Run hermetic safe suite
        run: python scripts/run_safe_tests.py

      - name: Parse and dry-run native PowerShell entry points
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          foreach ($path in @('scripts/install.ps1', 'scripts/launch_fl_studio.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          $userData = Join-Path $env:RUNNER_TEMP 'FL Studio User Data'
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1 `
            -DryRun -Python (Get-Command python).Source -UserDataDir $userData
          $fakeFl = Join-Path $env:RUNNER_TEMP 'FL Studio 2026\FakeFL64.exe'
          New-Item -ItemType Directory -Force (Split-Path $fakeFl) | Out-Null
          Set-Content -LiteralPath $fakeFl -Value 'dry run only'
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File scripts/launch_fl_studio.ps1 -DryRun -Executable $fakeFl

  package:
    name: Build and clean-install on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      FL_BRIDGE_ENABLE_MIDI: "0"
      FL_BRIDGE_ENABLE_WRITES: "0"
      FL_BRIDGE_SANDBOXED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify archive contents and metadata
        run: python scripts/verify_distribution.py

      - name: Install and verify wheel in a clean temporary environment
        run: python scripts/clean_wheel_smoke.py --dist-dir dist

      - name: Build the generic and Codex platform setup bundles
        run: python scripts/build_release_bundles.py --output-dir release-bundles

      - name: Smoke-test the extracted Windows bundle launchers
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (& python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])").Trim()
          $bundles = @(
            @{
              Label = 'generic'
              Archive = "release-bundles\PostFader-v$version-Windows.zip"
              Launcher = 'Install PostFader.cmd'
            },
            @{
              Label = 'Codex'
              Archive = "release-bundles\PostFader-v$version-Codex-Windows.zip"
              Launcher = 'Install PostFader for Codex.cmd'
            }
          )
          $env:POSTFADER_BUNDLE_DRY_RUN = '1'
          foreach ($bundle in $bundles) {
            if (-not (Test-Path -LiteralPath $bundle.Archive -PathType Leaf)) {
              throw "$($bundle.Label) Windows setup bundle was not built: $($bundle.Archive)"
            }
            $target = Join-Path $env:RUNNER_TEMP "postfader-windows-$($bundle.Label.ToLower())-bundle"
            Expand-Archive -LiteralPath $bundle.Archive -DestinationPath $target
            $launcher = Get-ChildItem $target -Recurse -File -Filter $bundle.Launcher |
              Select-Object -First 1
            if (-not $launcher) {
              throw "$($bundle.Label) Windows setup launcher was not found"
            }
            & cmd.exe /d /c ('"' + $launcher.FullName + '"')
            if ($LASTEXITCODE -ne 0) {
              throw "$($bundle.Label) Windows bundle launcher dry run failed"
            }
          }

      - name: Smoke-test the extracted macOS bundle launchers
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          for kind in generic codex; do
            if [ "$kind" = generic ]; then
              archive="release-bundles/PostFader-v${version}-macOS.zip"
              launcher_name='Install PostFader.command'
            else
              archive="release-bundles/PostFader-v${version}-Codex-macOS.zip"
              launcher_name='Install PostFader for Codex.command'
            fi
            test -f "$archive"
            target="$RUNNER_TEMP/postfader-macos-${kind}-bundle"
            ditto -x -k "$archive" "$target"
            launcher="$(find "$target" -type f -name "$launcher_name" -print -quit)"
            test -n "$launcher"
            POSTFADER_BUNDLE_DRY_RUN=1 "$launcher"
          done

      - name: Upload Python distributions
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: python-distributions-${{ matrix.os }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  mcpb:
    name: Validate user-facing release bundles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up Node for the MCPB packager
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Validate and build Claude Desktop extension
        run: python scripts/build_mcpb.py --output-dir mcpb-dist
      - name: Build deterministic generic and Codex setup bundles
        run: python scripts/build_release_bundles.py --output-dir release-bundles
      - name: Upload Claude Desktop extension
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: desktop-extension
          path: mcpb-dist/*.mcpb
          if-no-files-found: error
      - name: Upload generic and Codex platform setup bundles
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: platform-setup-bundles
          path: release-bundles/*.zip
          if-no-files-found: error
