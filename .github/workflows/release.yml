name: Release

# A version tag publishes the Python distributions through PyPI Trusted
# Publishing, publishes server.json to the MCP Registry, and creates a GitHub
# Release carrying friendly generic and Codex Windows/macOS setup ZIPs, the
# wheel, sdist, and Claude Desktop .mcpb extension.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Publication waits for this matrix as one job dependency. GitHub marks it
  # successful only when both native hosts pass on both declared edge Python
  # versions, so the Ubuntu artifact build cannot bypass supported platforms.
  platform-verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.10", "3.14"]
    env:
      FL_BRIDGE_ENABLE_MIDI: "0"
      FL_BRIDGE_ENABLE_WRITES: "0"
      FL_BRIDGE_SANDBOXED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Check public tree
        run: python scripts/check_public_tree.py

      - name: Install hermetic test and build environment
        run: |
          python -m pip install --upgrade pip build
          python -m pip install --editable ".[test]"

      - name: Run hermetic safe suite
        run: python scripts/run_safe_tests.py

      - name: Parse and dry-run native PowerShell entry points
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('scripts/install.ps1', 'scripts/launch_fl_studio.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          $userData = Join-Path $env:RUNNER_TEMP 'FL Studio User Data'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File scripts/install.ps1 -DryRun `
            -Python (Get-Command python.exe).Source -UserDataDir $userData
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 dry run failed" }
          $fakeFl = Join-Path $env:RUNNER_TEMP 'FL Studio 2026\FakeFL64.exe'
          New-Item -ItemType Directory -Force (Split-Path $fakeFl) | Out-Null
          Set-Content -LiteralPath $fakeFl -Value 'dry run only'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File scripts/launch_fl_studio.ps1 -DryRun -Executable $fakeFl
          if ($LASTEXITCODE -ne 0) { throw "read-only launcher dry run failed" }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File scripts/launch_fl_studio.ps1 -DryRun -EnableWrites `
            -Executable $fakeFl
          if ($LASTEXITCODE -ne 0) { throw "write-mode launcher dry run failed" }

      - name: Build wheel and sdist on the native host
        run: python -m build

      - name: Verify archive contents and publication metadata
        run: python scripts/verify_distribution.py --dist-dir dist

      - name: Install and verify the wheel in a clean native environment
        run: python scripts/clean_wheel_smoke.py --dist-dir dist

      - name: Build the generic and Codex platform setup bundles on the native host
        run: python scripts/build_release_bundles.py --output-dir release-bundles

      - name: Smoke-test the extracted Windows bundle launchers
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (& python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])").Trim()
          $bundles = @(
            @{
              Label = 'generic'
              Archive = "release-bundles\PostFader-v$version-Windows.zip"
              Launcher = 'Install PostFader.cmd'
            },
            @{
              Label = 'Codex'
              Archive = "release-bundles\PostFader-v$version-Codex-Windows.zip"
              Launcher = 'Install PostFader for Codex.cmd'
            }
          )
          $env:POSTFADER_BUNDLE_DRY_RUN = '1'
          foreach ($bundle in $bundles) {
            if (-not (Test-Path -LiteralPath $bundle.Archive -PathType Leaf)) {
              throw "$($bundle.Label) Windows setup bundle was not built: $($bundle.Archive)"
            }
            $target = Join-Path $env:RUNNER_TEMP "postfader-windows-$($bundle.Label.ToLower())-bundle"
            Expand-Archive -LiteralPath $bundle.Archive -DestinationPath $target
            $launcher = Get-ChildItem $target -Recurse -File -Filter $bundle.Launcher |
              Select-Object -First 1
            if (-not $launcher) {
              throw "$($bundle.Label) Windows setup launcher was not found"
            }
            & cmd.exe /d /c ('"' + $launcher.FullName + '"')
            if ($LASTEXITCODE -ne 0) {
              throw "$($bundle.Label) Windows bundle launcher dry run failed"
            }
          }

      - name: Smoke-test the extracted macOS bundle launchers
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          for kind in generic codex; do
            if [ "$kind" = generic ]; then
              archive="release-bundles/PostFader-v${version}-macOS.zip"
              launcher_name='Install PostFader.command'
            else
              archive="release-bundles/PostFader-v${version}-Codex-macOS.zip"
              launcher_name='Install PostFader for Codex.command'
            fi
            test -f "$archive"
            target="$RUNNER_TEMP/postfader-macos-${kind}-bundle"
            ditto -x -k "$archive" "$target"
            launcher="$(find "$target" -type f -name "$launcher_name" -print -quit)"
            test -n "$launcher"
            POSTFADER_BUNDLE_DRY_RUN=1 "$launcher"
          done

  build:
    name: Build verified publishing artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up Node for the MCPB packager
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Check public tree
        run: python scripts/check_public_tree.py

      # Registry validation belongs before either publication job. Discovering
      # a malformed server.json only after PyPI accepted the version would
      # leave an irreparable partial release.
      - name: Validate MCP Registry manifest before publishing
        run: |
          mkdir -p /tmp/postfader-mcp-publisher
          curl --fail --location --silent --show-error \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_linux_amd64.tar.gz \
            --output /tmp/postfader-mcp-publisher.tar.gz
          echo "ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac  /tmp/postfader-mcp-publisher.tar.gz" | sha256sum --check
          tar -xzf /tmp/postfader-mcp-publisher.tar.gz \
            -C /tmp/postfader-mcp-publisher mcp-publisher
          /tmp/postfader-mcp-publisher/mcp-publisher --version
          /tmp/postfader-mcp-publisher/mcp-publisher validate server.json

      # A tag that disagrees with the package version is irreversible once it
      # reaches PyPI, so refuse it before creating publication artifacts.
      - name: Refuse a tag that disagrees with public version declarations
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import json, os, pathlib, sys, tomllib

          declared = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{declared}"
          if tag != expected:
              print(f"::error::tag {tag} does not match {expected}")
              sys.exit(1)

          server = json.loads(pathlib.Path("server.json").read_text(encoding="utf-8"))
          manifest = json.loads(
              pathlib.Path("manifest.json").read_text(encoding="utf-8")
          )
          versions = [server.get("version"), manifest.get("version")]
          versions.extend(item.get("version") for item in server.get("packages", []))
          if any(version != declared for version in versions):
              print(f"::error::public versions {versions!r} do not all equal {declared}")
              sys.exit(1)
          print(f"tag and public versions agree: {tag}")
          PY

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      # This centralized verifier also refuses a wheel whose PyPI long
      # description lost the MCP Registry ownership marker.
      - name: Verify archive contents and publication metadata
        run: python scripts/verify_distribution.py --dist-dir dist

      - name: Install and verify the wheel in a clean environment
        run: python scripts/clean_wheel_smoke.py --dist-dir dist

      # scripts/build_mcpb.py validates with an exact
      # @anthropic-ai/mcpb@2.1.2 pin before it creates the archive.
      - name: Validate and build Claude Desktop extension
        run: python scripts/build_mcpb.py --output-dir mcpb-dist

      - name: Build and verify deterministic generic and Codex setup bundles
        run: python scripts/build_release_bundles.py --output-dir release-bundles

      # These artifacts stay separate by design: the PyPI action below reads
      # dist/ wholesale and must never be handed a .mcpb file.
      - name: Upload Python distributions for publishing
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

      - name: Upload Claude Desktop extension for the GitHub Release
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-desktop-extension
          path: mcpb-dist/*.mcpb
          if-no-files-found: error

      - name: Upload generic and Codex platform setup bundles for the GitHub Release
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-platform-bundles
          path: release-bundles/*.zip
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [build, platform-verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only ever publishes for a version tag, never for a manual run on a
    # branch. `workflow_dispatch` above exists to rehearse all verification.
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/postfader-fl-studio-mcp
    permissions:
      id-token: write
    steps:
      - name: Fetch the verified distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-python-distributions
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: true

  github-release:
    name: Attach verified artifacts to GitHub Release
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Fetch Python distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-python-distributions
          path: release-assets/

      - name: Fetch Claude Desktop extension
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-desktop-extension
          path: release-assets/

      - name: Fetch generic and Codex platform setup bundles
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-platform-bundles
          path: release-assets/

      - name: Publish SHA-256 checksums for every downloadable artifact
        env:
          CHECKSUM_FILE: release-assets/PostFader-${{ github.ref_name }}-SHA256SUMS.txt
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          directory = Path("release-assets")
          target = Path(os.environ["CHECKSUM_FILE"])
          artifacts = sorted(path for path in directory.iterdir() if path.is_file())
          if not artifacts:
              raise SystemExit("no release artifacts were downloaded")
          lines = []
          for artifact in artifacts:
              digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
              lines.append(f"{digest}  {artifact.name}")
          target.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(target.read_text(encoding="utf-8"), end="")
          PY

      - name: Create the release or replace its assets on a retry
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag \
              --generate-notes \
              --title "PostFader $GITHUB_REF_NAME"
          fi

  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install MCP Registry publisher v1.7.9
        run: |
          mkdir -p /tmp/postfader-mcp-publisher
          curl --fail --location --silent --show-error \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_linux_amd64.tar.gz \
            --output /tmp/mcp-publisher.tar.gz
          echo "ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac  /tmp/mcp-publisher.tar.gz" | sha256sum --check
          tar -xzf /tmp/mcp-publisher.tar.gz \
            -C /tmp/postfader-mcp-publisher mcp-publisher
          /tmp/postfader-mcp-publisher/mcp-publisher --version

      - name: Validate MCP Registry manifest
        run: /tmp/postfader-mcp-publisher/mcp-publisher validate server.json

      - name: Authenticate to MCP Registry
        run: /tmp/postfader-mcp-publisher/mcp-publisher login github-oidc

      - name: Publish MCP server version
        run: /tmp/postfader-mcp-publisher/mcp-publisher publish server.json
