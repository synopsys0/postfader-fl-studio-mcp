name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: "/language:${{ matrix.language }}"

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Review changed dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          show-patched-versions: true

  pip-audit:
    name: pip-audit advisory report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the project and pinned audit tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[test]"
          python -m pip freeze --exclude-editable > pip-audit-requirements.txt
          python -m pip install pip-audit==2.10.1

      # This report is intentionally advisory while maintainers calibrate
      # false positives and historical findings. Dependency Review above is
      # the PR gate for newly introduced high/critical vulnerabilities.
      - name: Run pip-audit and retain its report
        shell: bash
        run: |
          set +e
          pip-audit --requirement pip-audit-requirements.txt \
            --format=json --output=pip-audit.json
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning::pip-audit reported advisories or could not complete; review pip-audit.json"
          fi
          if [ ! -f pip-audit.json ]; then
            printf '%s\n' '{"error":"pip-audit did not produce a report"}' > pip-audit.json
          fi
          exit 0

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: pip-audit-report
          path: pip-audit.json
          if-no-files-found: error
          retention-days: 14
